<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09285d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><title>松原仁の国会クイズ</title><style>
:root{font-family:system-ui,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 5%,#1773d1,#082858 58%,#051329)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff75c;outline-offset:3px}.hide{display:none!important}.screen{max-width:1100px;margin:auto}.cover{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(circle at 75% 18%,#236ebc 0%,#071e47 62%,#030f28 100%)}.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 15%,#00132b88 100%);pointer-events:none}.cover>*{position:relative}.eyebrow{font-size:clamp(13px,2vw,21px);letter-spacing:.16em;font-weight:900;color:#ffe98d;text-shadow:0 2px 6px #000}.cover h1{margin:14px 0 8px;font-size:clamp(40px,8vw,88px);line-height:1.13;color:#ffe17a;-webkit-text-stroke:1px #864400;text-shadow:0 4px #8d3800,0 9px #052355,0 12px 22px #000}.cover p{font-size:clamp(16px,2.5vw,25px);font-weight:800;text-shadow:0 3px 7px #000;max-width:700px}.startbtn,.next{border:3px solid #ffe99e;border-radius:999px;background:linear-gradient(#ff6750,#ba0923);color:white;font-weight:950;padding:16px 28px;box-shadow:0 6px 0 #780b15,0 14px 22px #0007;text-shadow:0 2px #7a0800}.startbtn{margin-top:32px;width:min(100%,410px);font-size:clamp(20px,4vw,30px)}.game{min-height:100dvh;padding:22px;background:radial-gradient(circle at 70% 0%,#1763b3,#08275c 62%,#04142f);border:4px solid #eec65e;border-radius:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:clamp(23px,4vw,48px);font-weight:1000;color:#ffe37c;text-shadow:0 3px #7c3c00,0 7px #001d40}.total{flex-shrink:0;background:#ffe18c;color:#4d2800;border-radius:99px;padding:10px 15px;font-weight:900}.progresslabel{display:flex;justify-content:space-between;margin-top:20px;font-weight:900}.progress{height:12px;border-radius:20px;border:2px solid #ffe09b;background:#061f4a;overflow:hidden;margin:8px 0 20px}.progress div{height:100%;background:linear-gradient(90deg,#f7a624,#fff3a5);transition:width .3s}.stage{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);gap:20px;align-items:start}.character img{width:100%;max-height:560px;object-fit:contain;border:4px solid #ffdb78;border-radius:18px;background:#165d9d;box-shadow:0 9px 20px #0018}.speech{margin-bottom:12px;background:#fff;color:#12407a;padding:14px;border-radius:16px;border:3px solid #9bdaff;text-align:center;font-weight:900}.panel{min-width:0;padding:24px;border:4px solid #ffda78;border-radius:22px;background:linear-gradient(145deg,#218cd8ed,#064b9bf2 45%,#063777f5);box-shadow:0 12px 25px #001a}.room{font-size:clamp(17px,2.5vw,25px);font-weight:900}.counter{margin:10px 0 16px;color:#ffe69c;font-weight:800}.question{font-size:clamp(20px,2.8vw,31px);font-weight:900;line-height:1.5;background:#061f50;padding:20px;border:2px solid #91d5ff;border-radius:16px;text-align:center}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.choice{width:100%;min-width:0;min-height:88px;border:3px solid #8ed0ff;border-radius:18px;background:linear-gradient(#fff,#dbeeff);color:#092956;padding:12px;font-size:clamp(15px,1.9vw,21px);font-weight:900;line-height:1.35;box-shadow:0 5px #0a3d83;overflow-wrap:anywhere}.choice:disabled{opacity:.86}.choice.selected{background:linear-gradient(#fff5b8,#ffce58);border-color:#ffe387}.result{margin-top:24px;border-radius:17px;border:3px solid #ffe08b;background:#fff4ce;color:#17365d;padding:20px;text-align:center}.result img{display:block;max-height:210px;max-width:100%;object-fit:contain;margin:auto}.result h2{font-size:26px}.explain{text-align:left;line-height:1.75;background:#fff;padding:14px;border-radius:12px}.next{width:100%;margin-top:18px;font-size:19px}.finish{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 18px}.finish h1{font-size:clamp(30px,5vw,56px);color:#ffe17d;text-shadow:0 4px #784100}.finish img{max-height:53dvh;max-width:min(100%,520px);object-fit:contain;border:5px solid #ffda72;border-radius:20px;background:#154b8c}.finish p{font-size:clamp(18px,3vw,26px);font-weight:900}.finish .next{max-width:450px}.foot{text-align:center;color:#c8ddff;font-size:11px;padding:16px}
@media(max-width:700px){.cover{padding:24px 16px}.game{border-width:2px;border-radius:0;padding:12px}.top{align-items:start}.brand{font-size:clamp(21px,6vw,30px)}.total{padding:7px 10px;font-size:12px}.stage{grid-template-columns:1fr;gap:14px}.character{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:12px}.character img{grid-column:1;grid-row:1;max-height:155px}.speech{grid-column:2;grid-row:1;margin:0;padding:10px;font-size:14px}.panel{padding:13px;border-width:3px}.question{font-size:20px;padding:15px 11px}.choices{grid-template-columns:1fr;gap:12px}.choice{min-height:64px;border-radius:14px;font-size:17px;padding:12px}.progresslabel{font-size:14px}.finish img{max-height:45dvh}}
@media(min-width:701px) and (max-width:850px){.choices{gap:12px}.choice{font-size:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* 2026-11-02 redesign: separate cover art and UI, no repeated backdrop */
.cover{padding:clamp(16px,4vw,44px);min-height:100dvh;isolation:isolate}
.cover:before{background:radial-gradient(circle at 25% 20%,#4d9bff2b,transparent 50%)}
.opening-layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:clamp(18px,4vw,50px);width:100%;max-width:1060px}
.opening-art{min-width:0;display:flex;align-items:center;justify-content:center}

}

.opening-screen{width:100%;max-width:none;min-height:100dvh;display:grid;place-items:center;background:#07316c;padding:0}

</style></head><body><section id="start" class="screen opening-screen"><div class="opening-frame"><img src="opening.png" class="opening-image" alt="松原仁の国会クイズ・オープニング"><button class="opening-hotspot" onclick="startGame()" aria-label="探検スタート"></button><div id="videoOverlay" class="video-overlay hide"><video id="openingVideo" playsinline webkit-playsinline preload="metadata" src="opening-video.mp4" onended="closeOpeningVideo()"></video><button class="video-close" onclick="closeOpeningVideo()" aria-label="動画を閉じる">✕ 閉じる</button><div class="video-note">再生終了後、表紙に戻ります</div></div></div></section><section id="game" class="screen game hide"><header class="top"><div class="brand">🏛 松原仁の国会クイズ</div><div class="total">全10問</div></header><div class="progresslabel"><span id="room"></span><span id="counter"></span></div><div class="progress"><div id="bar"></div></div><div class="stage"><aside class="character"><div class="speech" id="speech"></div><img id="guide" src="stage-01.webp" alt="松原仁キャラクター"></aside><article class="panel"><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="result hide" id="result"><img id="reaction" alt="正誤のリアクション"><h2 id="message"></h2><div class="explain" id="explain"></div><button class="next" onclick="nextQuestion()" id="next">次の部屋へ進む ▶</button></div></article></div></section><section class="screen finish hide" id="finish"><h1 id="finishTitle"></h1><img id="finishImage" alt="結果"><p id="finishText"></p><button class="next" onclick="startGame()">もう一度挑戦する ▶</button></section><div class="foot">国会について学ぶ非公式の教育用ゲームです。特定の政治家・団体の公式制作物ではありません。</div><script>
const questions=[{"p": "国会議事堂・正門", "q": "日本の国会は、何を担う機関と定められている？", "o": ["国の唯一の立法機関", "裁判を行う最高機関", "地方自治体の代表機関", "行政を執行する機関"], "a": 0, "e": "日本国憲法第41条では、国会は国権の最高機関であり、国の唯一の立法機関と定められています。"}, {"p": "中央広間", "q": "日本の国会を構成する二つの議院は？", "o": ["衆議院と参議院", "衆議院と最高裁判所", "参議院と内閣", "内閣と地方議会"], "a": 0, "e": "日本の国会は、衆議院と参議院からなる二院制です。"}, {"p": "衆議院・議場", "q": "衆議院議員の任期は原則何年？", "o": ["2年", "3年", "4年", "6年"], "a": 2, "e": "衆議院議員の任期は4年です。ただし衆議院が解散された場合は任期途中でも終了します。"}, {"p": "参議院・議場", "q": "参議院議員の任期は何年？", "o": ["3年", "4年", "5年", "6年"], "a": 3, "e": "参議院議員の任期は6年で、3年ごとに議員の半数が改選されます。"}, {"p": "委員会室", "q": "法案を詳しく審査する場として適切なのは？", "o": ["委員会", "裁判所", "大使館", "都道府県警察"], "a": 0, "e": "国会では本会議だけでなく、各委員会でも法案などを詳しく審査します。"}, {"p": "予算委員会室", "q": "国の予算を先に審議するのはどちらの議院？", "o": ["参議院", "衆議院", "同時に始める決まり", "最高裁判所"], "a": 1, "e": "日本国憲法第60条により、予算は先に衆議院に提出しなければなりません。"}, {"p": "国会図書館・資料室", "q": "国会議員の調査や立法活動を支える国立の図書館は？", "o": ["国立国会図書館", "国立科学博物館", "国立公文書館だけ", "東京都立中央図書館"], "a": 0, "e": "国立国会図書館は、国会議員の調査研究を支援する役割を担っています。"}, {"p": "本会議場", "q": "内閣総理大臣を指名するのはどこ？", "o": ["国会", "最高裁判所", "各都道府県知事", "日本銀行"], "a": 0, "e": "内閣総理大臣は、国会議員の中から国会の議決で指名されます。"}, {"p": "議員会館・会議室", "q": "国会議員が政府に質問するために提出できるものは？", "o": ["質問主意書", "住民票", "運転免許証", "戸籍謄本"], "a": 0, "e": "議員は議院の規則に従い、質問主意書を提出して政府に質問することができます。"}, {"p": "国会議事堂・ゴール", "q": "憲法改正の発議には、各議院の総議員の何分の何以上の賛成が必要？", "o": ["過半数", "3分の2", "4分の1", "全員一致"], "a": 1, "e": "憲法第96条により、各議院の総議員の3分の2以上の賛成で国会が発議し、国民の承認を経ます。"}];let index=0,correct=0,answered=false;const $=id=>document.getElementById(id);function show(id){['start','game','finish'].forEach(s=>$(s).classList.toggle('hide',s!==id))}function stopOpeningSound(){closeOpeningVideo();if('speechSynthesis' in window)speechSynthesis.cancel();}
async function playOpeningVideo(){
 const overlay=$('videoOverlay'),video=$('openingVideo');
 overlay.classList.remove('hide');video.currentTime=0;video.muted=false;video.volume=1;
 try{await video.play();}catch(e){overlay.classList.add('hide');alert('動画を再生できませんでした。もう一度お試しください。');}
}
function closeOpeningVideo(){const video=$('openingVideo');if(video){video.pause();try{video.currentTime=0;}catch(e){}}const overlay=$('videoOverlay');if(overlay)overlay.classList.add('hide');}

let bgmEnabled=true;
function updateBgmButton(){const b=$('bgmToggle');b.textContent=bgmEnabled?'🔊 BGM ON':'🔇 BGM OFF';b.setAttribute('aria-pressed',String(bgmEnabled));}
function playGameBgm(){const a=$('gameBgm');if(!bgmEnabled)return;a.volume=0.32;const p=a.play();if(p&&typeof p.catch==='function')p.catch(()=>{bgmEnabled=false;updateBgmButton();});}
function stopGameBgm(){const a=$('gameBgm');a.pause();try{a.currentTime=0;}catch(e){}}
function toggleBgm(){bgmEnabled=!bgmEnabled;updateBgmButton();if(bgmEnabled){playGameBgm()}else{$('gameBgm').pause()}}
function startGame(){stopOpeningSound();index=0;correct=0;show('game');$('bgmToggle').classList.remove('hide');updateBgmButton();playGameBgm();render();scrollTo(0,0)}function render(){answered=false;const q=questions[index];$('result').classList.add('hide');$('choices').innerHTML='';$('room').textContent='📍 '+q.p;$('counter').textContent=`${index+1} / 10問`;$('question').textContent=q.q;$('speech').textContent=['正門からスタート！','中央広間を探検！','衆議院を見学！','参議院の仕組み！','委員会を探検！','予算について学ぼう！','資料を調べよう！','本会議の役割！','議員の仕事を学ぼう！','いよいよ最終問題！'][index];const filename=`stage-${String(index+1).padStart(2,'0')}.webp`;$('guide').src=filename;$('bar').style.width=`${index/10*100}%`;q.o.forEach((option,i)=>{const b=document.createElement('button');b.className='choice';b.textContent='①②③④'[i]+' '+option;b.onclick=()=>answer(i,b);$('choices').appendChild(b)})}function answer(i,button){if(answered)return;answered=true;const q=questions[index],ok=i===q.a;if(ok)correct++;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);button.classList.add('selected');$('reaction').src=ok?'正しい.webp':'間違った.webp';$('message').textContent=ok?'🎉 正解！':'💡 残念！ 正解を確認しよう';$('explain').textContent='正解：'+q.o[q.a]+'。 '+q.e;$('next').textContent=index===9?'🏆 結果を見る ▶':'🚪 次の部屋へ進む ▶';$('result').classList.remove('hide');$('speech').textContent=ok?'大正解！':'次の問題も頑張ろう！';$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}function nextQuestion(){index++;if(index<questions.length){render();$('game').scrollIntoView({behavior:'smooth',block:'start'})}else{stopGameBgm();$('bgmToggle').classList.add('hide');show('finish');const perfect=correct===10;$('finishTitle').textContent=perfect?'🏆 全問正解！ おめでとう！':'残念！ また挑戦してね！';$('finishImage').src=perfect?'win.webp':'間違った.webp';$('finishText').textContent=`全10問中 ${correct} 問正解！`;scrollTo(0,0)}}
</script><audio id="gameBgm" src="jinjin-song.mp3" preload="none" loop></audio><button id="bgmToggle" class="hide" type="button" onclick="toggleBgm()" aria-label="BGMのオンとオフ">🔊 BGM ON</button></body></html>
